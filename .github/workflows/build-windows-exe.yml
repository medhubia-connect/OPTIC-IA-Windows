name: Build OPTIC IA Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Rebuild toupcam.dll
        working-directory: OPTIC-IA-Windows-v4.8.9.25-EXE-READY
        shell: powershell
        run: |
          $a = [System.IO.File]::ReadAllBytes("toupcam.dll.part0")
          $b = [System.IO.File]::ReadAllBytes("toupcam.dll.part1")
          $out = New-Object byte[] ($a.Length + $b.Length)
          [Array]::Copy($a, 0, $out, 0, $a.Length)
          [Array]::Copy($b, 0, $out, $a.Length, $b.Length)
          [System.IO.File]::WriteAllBytes("toupcam.dll", $out)
          Get-Item toupcam.dll | Format-List Name,Length

      - name: Build portable EXE
        working-directory: OPTIC-IA-Windows-v4.8.9.25-EXE-READY
        run: pyinstaller --clean --noconfirm OPTIC-IA.spec

      - name: Verify output
        shell: powershell
        run: |
          if (!(Test-Path "OPTIC-IA-Windows-v4.8.9.25-EXE-READY/dist/OPTIC-IA.exe")) {
            throw "OPTIC-IA.exe no fue generado"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OPTIC-IA-Windows-v4.8.9.26
          path: OPTIC-IA-Windows-v4.8.9.25-EXE-READY/dist/OPTIC-IA.exe
