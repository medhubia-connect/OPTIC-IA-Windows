name: Build OPTIC IA Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build portable EXE
        working-directory: OPTIC-IA-Windows-v4.8.9.25-EXE-READY
        run: pyinstaller --clean --noconfirm OPTIC-IA.spec

      - name: Verify output
        shell: powershell
        run: |
          if (!(Test-Path "OPTIC-IA-Windows-v4.8.9.25-EXE-READY/dist/OPTIC-IA.exe")) {
            throw "OPTIC-IA.exe no fue generado"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OPTIC-IA-Windows-v4.8.9.25
          path: OPTIC-IA-Windows-v4.8.9.25-EXE-READY/dist/OPTIC-IA.exe
